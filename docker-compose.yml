services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      RUN_SEED: ${RUN_SEED:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-okdriver}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-okdriver}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  simulator:
    build: ./backend
    env_file: .env
    environment:
      SIMULATOR_API_URL: http://backend:8000
      SIMULATOR_USERNAME: ${SEED_OPERATOR_USERNAME:-operator}
      SIMULATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
    command: ["python", "-m", "simulator.main"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okdriver}
      POSTGRES_USER: ${POSTGRES_USER:-okdriver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
